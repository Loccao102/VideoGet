<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VideoGet Subtitle Editor</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0d11;color:#edf2f7;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1440px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.muted{color:#91a0b5}.panel{background:#121720;border:1px solid #293140;border-radius:14px;padding:16px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input,textarea,select{font:inherit}button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:#f2f2f2;color:#111}button.secondary{background:#202735;color:#e4edf8;border:1px solid #394457}button:disabled{opacity:.5;cursor:not-allowed}input,textarea,select{background:#0d1117;color:#fff;border:1px solid #344052;border-radius:8px;padding:8px}#jobId{min-width:280px}.video-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.video-card video{width:100%;max-height:420px;background:#000;border-radius:10px}.video-card h3{margin:0 0 10px}.editor{margin-top:16px;overflow:auto}.row{display:grid;grid-template-columns:55px 90px 90px minmax(220px,1fr) minmax(300px,1.35fr) 120px 110px;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid #242c38}.head{position:sticky;top:0;background:#121720;z-index:2;font-size:12px;font-weight:800;color:#aebbd0}.row textarea{width:100%;min-height:74px;resize:vertical;line-height:1.4}.source{font-size:13px;line-height:1.45;color:#c6d1df;white-space:pre-wrap;padding:8px;border-radius:8px;background:#0d1117;min-height:74px}.rate-hint{font-size:11px;color:#93a2b6;margin-top:5px}.rate-hint.fast{color:#ffd080}.rate-hint.too-fast{color:#ff9a9a}.status{margin-top:10px;white-space:pre-wrap}.ok{color:#8ee59d}.bad{color:#ff9a9a}.warn{color:#ffd080}.sticky{position:sticky;bottom:12px;margin-top:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.35)}.qa{margin-top:10px;padding:10px 12px;border:1px solid #303a49;border-radius:10px;background:#0d1117;font-size:12px}.qa.pass{border-color:#315e43;color:#8ee59d}.qa.warning{border-color:#6e592b;color:#ffd080}.qa.error{border-color:#6b3030;color:#ff9a9a}.qa-inline{font-size:11px;line-height:1.35;margin-top:6px;white-space:pre-wrap}.segment.qa-warning{background:rgba(122,92,29,.08)}.segment.qa-error{background:rgba(130,40,40,.10)}.segment.qa-warning .target{border-color:#80672f}.segment.qa-error .target{border-color:#8f4444}@media(max-width:980px){.video-grid{grid-template-columns:1fr}.row{grid-template-columns:45px 82px 82px minmax(180px,1fr) minmax(240px,1.2fr) 100px}.row>*:last-child{display:none}}@media(max-width:700px){.wrap{padding:12px}.row{grid-template-columns:42px 75px 75px 1fr}.source{grid-column:1/-1}.target-wrap{grid-column:1/-1}.rate{grid-column:2/5}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div><h1 style="margin:0">Subtitle Editor <span class="muted" style="font-size:14px">Localization V2</span></h1><p class="muted">Sửa nội dung + timing từng đoạn. `Auto` sẽ tăng tốc voice khi câu Việt dài hơn slot.</p></div>
    <div class="controls"><input id="jobId" placeholder="Job ID"><button id="load">Mở job</button><button class="secondary" onclick="location.href='/'">← Dashboard</button></div>
  </div>

  <section id="media" class="video-grid" hidden>
    <div class="panel video-card"><h3>Video gốc</h3><video id="sourceVideo" controls preload="metadata"></video></div>
    <div class="panel video-card"><h3>Bản render hiện tại</h3><video id="outputVideo" controls preload="metadata"></video></div>
  </section>

  <section class="panel editor">
    <div id="summary" class="muted">Nhập Job ID hoặc mở bằng URL <code>?job=&lt;id&gt;</code>.</div>
    <div id="qa" class="qa muted">QA sẽ xuất hiện sau khi job được Localization V2 xử lý.</div>
    <div id="rows"></div>
  </section>

  <section id="actions" class="panel sticky" hidden>
    <div id="status" class="status muted">Chưa có thay đổi.</div>
    <div class="controls"><button id="save" class="secondary">Lưu draft</button><button id="rerender">Lưu + Render lại</button></div>
  </section>
</main>
<script>
const S={job:'',doc:null,dirty:false,quality:null};
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);$('jobId').value=params.get('job')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const visibleChars=s=>String(s||'').replace(/\s+/g,'').length;
function rateEstimate(seg){const dur=Math.max(.15,(+seg.end||0)-(+seg.start||0)),cps=visibleChars(seg.text)/dur,target=14,needed=Math.max(0,Math.round((cps/target-1)*100));return {cps,needed:Math.min(100,needed)}}
function setStatus(text,cls='muted'){$('status').className='status '+cls;$('status').textContent=text}
function collect(){return [...document.querySelectorAll('.segment')].map(row=>({id:+row.dataset.id,start:+row.querySelector('.start').value,end:+row.querySelector('.end').value,sourceText:row.dataset.source,text:row.querySelector('.target').value.trim(),speechRate:row.querySelector('.rate').value.trim()||'auto'}))}
function clearQualityRows(){for(const row of document.querySelectorAll('.segment')){row.classList.remove('qa-warning','qa-error');const inline=row.querySelector('.qa-inline');if(inline){inline.textContent='';inline.className='qa-inline'}}}
function markDirty(){S.dirty=true;setStatus('Có thay đổi chưa lưu.','warn');$('qa').className='qa warning';$('qa').textContent='Draft đã thay đổi. QA hiện tại đã cũ; QA sẽ chạy lại sau khi Render lại.';clearQualityRows()}
function updateHint(row){const seg={start:+row.querySelector('.start').value,end:+row.querySelector('.end').value,text:row.querySelector('.target').value},est=rateEstimate(seg),hint=row.querySelector('.rate-hint');hint.textContent=`${est.cps.toFixed(1)} ký tự/s · auto dự kiến ${est.needed?`+${est.needed}%`:'rate gốc'}`;hint.className='rate-hint '+(est.needed>70?'too-fast':est.needed>25?'fast':'')}
function renderQuality(doc){S.quality=doc||null;clearQualityRows();const box=$('qa');if(!doc?.report){box.className='qa muted';box.textContent='Chưa có Translation QA cho job này. Render bằng Localization V2 để tạo report.';return}const r=doc.report,status=r.status||'pass';box.className='qa '+status;box.textContent=`QA ${status.toUpperCase()} · ${r.errors||0} error · ${r.warnings||0} warning · ${r.segments||0} đoạn · ${doc.semanticBlockCount||0} semantic block`;
  const byId=new Map();for(const issue of r.issues||[]){const key=String(issue.segmentId);if(!byId.has(key))byId.set(key,[]);byId.get(key).push(issue)}
  for(const row of document.querySelectorAll('.segment')){const issues=byId.get(String(row.dataset.id))||[];if(!issues.length)continue;const hasError=issues.some(x=>x.severity==='error');row.classList.add(hasError?'qa-error':'qa-warning');const inline=row.querySelector('.qa-inline');inline.className='qa-inline '+(hasError?'bad':'warn');inline.textContent=issues.map(x=>`${x.code}: ${x.detail}`).join('\n')}}
function render(doc){S.doc=doc;S.dirty=false;$('rows').replaceChildren();$('actions').hidden=false;$('media').hidden=false;$('sourceVideo').src=`/api/jobs/${encodeURIComponent(S.job)}/media/source`;$('outputVideo').src=`/api/jobs/${encodeURIComponent(S.job)}/media/output?t=${Date.now()}`;$('summary').textContent=`${doc.segments.length} đoạn · ${doc.draft?'đang dùng draft đã sửa':'bản dịch hiện tại'}${doc.editedAt?` · sửa ${doc.editedAt}`:''}`;
  const head=document.createElement('div');head.className='row head';head.innerHTML='<div>#</div><div>Bắt đầu</div><div>Kết thúc</div><div>Nguồn</div><div>Tiếng Việt</div><div>Voice rate</div><div>Đã áp dụng</div>';$('rows').append(head);
  for(const seg of doc.segments){const row=document.createElement('div');row.className='row segment';row.dataset.id=seg.id;row.dataset.source=seg.sourceText||'';row.innerHTML=`<div>${seg.id}</div><input class="start" type="number" min="0" step="0.01" value="${Number(seg.start).toFixed(2)}"><input class="end" type="number" min="0" step="0.01" value="${Number(seg.end).toFixed(2)}"><div class="source">${esc(seg.sourceText||'')}</div><div class="target-wrap"><textarea class="target">${esc(seg.text||'')}</textarea><div class="qa-inline"></div></div><div><select class="rate"><option value="auto">Auto</option><option value="+10%">+10%</option><option value="+20%">+20%</option><option value="+30%">+30%</option><option value="+40%">+40%</option><option value="+50%">+50%</option><option value="+60%">+60%</option><option value="+70%">+70%</option></select><div class="rate-hint"></div></div><div class="muted">${esc(seg.appliedSpeechRate||'-')}</div>`;row.querySelector('.rate').value=seg.speechRate||'auto';for(const el of row.querySelectorAll('input,textarea,select'))el.addEventListener('input',()=>{markDirty();updateHint(row)});updateHint(row);$('rows').append(row)}
  setStatus('Đã tải subtitle.','ok')}
async function fetchQuality(id){try{const r=await fetch(`/api/jobs/${encodeURIComponent(id)}/subtitles/quality`),d=await r.json();return r.ok?d:null}catch{return null}}
async function load(){const id=$('jobId').value.trim();if(!id)return;S.job=id;history.replaceState(null,'',`?job=${encodeURIComponent(id)}`);setStatus('Đang tải...');try{const [subtitleRes,qualityDoc]=await Promise.all([fetch(`/api/jobs/${encodeURIComponent(id)}/subtitles`),fetchQuality(id)]),d=await subtitleRes.json();if(!subtitleRes.ok)throw Error(d.error||'Không đọc được subtitle');render(d);renderQuality(qualityDoc)}catch(e){setStatus(e.message,'bad')}}
async function save(){if(!S.job)return null;const payload={segments:collect()};setStatus('Đang lưu draft...');const r=await fetch(`/api/jobs/${encodeURIComponent(S.job)}/subtitles`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)throw Error(d.error||'Lưu subtitle thất bại');S.doc=d;S.dirty=false;$('qa').className='qa warning';$('qa').textContent='Draft đã lưu. QA sẽ được tạo lại khi bạn Render lại.';clearQualityRows();setStatus('Đã lưu draft. Video hiện tại chưa thay đổi cho tới khi Render lại.','ok');return d}
async function rerender(){try{await save();$('save').disabled=true;$('rerender').disabled=true;setStatus('Đã vào hàng render: tạo lại voice theo từng slot → QA → smart render...','warn');const r=await fetch(`/api/jobs/${encodeURIComponent(S.job)}/subtitles/rerender`,{method:'POST'}),d=await r.json();if(!r.ok)throw Error(d.error||'Không thể render lại');poll()}catch(e){setStatus(e.message,'bad');$('save').disabled=false;$('rerender').disabled=false}}
async function poll(){try{const j=await fetch(`/api/jobs/${encodeURIComponent(S.job)}`).then(r=>r.json());if(j.status==='done'){setStatus('Render hoàn tất. Đang nạp lại subtitle + QA + video mới...','ok');$('save').disabled=false;$('rerender').disabled=false;await load();$('outputVideo').src=`/api/jobs/${encodeURIComponent(S.job)}/media/output?t=${Date.now()}`;return}if(String(j.status).includes('failed')){setStatus(j.error||'Render thất bại','bad');$('save').disabled=false;$('rerender').disabled=false;return}setStatus(`Đang render... trạng thái: ${j.status}`,'warn');setTimeout(poll,2000)}catch(e){setStatus(e.message,'bad');$('save').disabled=false;$('rerender').disabled=false}}
$('load').onclick=load;$('save').onclick=()=>save().catch(e=>setStatus(e.message,'bad'));$('rerender').onclick=rerender;$('jobId').addEventListener('keydown',e=>{if(e.key==='Enter')load()});if($('jobId').value)load();
</script>
</body>
</html>
