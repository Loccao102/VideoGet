<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VideoGet</title><style>body{font-family:system-ui;background:#0b0d11;color:#eee;margin:0}.wrap{max-width:1100px;margin:auto;padding:40px 20px}.panel,.card{background:#13171f;border:1px solid #293140;border-radius:14px}.panel{padding:18px}.search{display:grid;grid-template-columns:1fr auto;gap:10px}input,button,select{font:inherit}input[type=text],select{background:#0d1117;color:#fff;border:1px solid #333d4d;border-radius:10px;padding:12px}button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.filters{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:20px}.card{overflow:hidden}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#080a0e}.body{padding:12px}.title{font-weight:700;min-height:44px}.meta{font-size:12px;color:#9aa7b7;margin:8px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#9aa7b7}.error{white-space:pre-wrap;color:#ffb5b5;margin-top:10px}.jobs{margin-top:28px}.job{padding:12px 0;border-top:1px solid #252c38}.job small{display:block;color:#9aa7b7;margin-top:5px;word-break:break-all}.status{font-weight:700}.ok{color:#8ee59d}.warn{color:#ffd080}.bad{color:#ff9a9a}@media(max-width:600px){.search{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>VideoGet</h1><p class="muted">Tìm video theo từ khóa trên Bilibili/Douyin → tải → tự nhận giọng → dịch subtitle → tạo voice tiếng Việt → render video Việt hóa.</p><section class="panel"><form id="f"><div class="search"><input id="keyword" type="text" placeholder="AI Agent, 微服务..." required><button id="searchBtn">Tìm video</button></div><div class="filters"><label><input type="checkbox" name="src" value="bilibili" checked> Bilibili</label><label><input type="checkbox" name="src" value="douyin" checked> Douyin</label><label>Limit <select id="limit"><option>10</option><option selected>20</option><option>50</option></select></label></div><div id="health" class="muted" style="margin-top:10px"></div><div id="err" class="error"></div></form></section><div class="row" style="margin-top:24px"><div id="count" class="muted">Chưa có kết quả</div><button id="downloadSelected" disabled>Tải + Việt hóa đã chọn</button></div><section id="results" class="grid"></section><section class="panel jobs"><div class="row"><strong>Jobs: Download → Sub → Dịch → Voice → Render</strong><button id="refresh" type="button">Làm mới</button></div><div id="jobs"></div></section></main><script>const S={results:[],selected:new Set()};const $=id=>document.getElementById(id);const statusLabel={queued:'Đang chờ',downloading:'Đang tải',localizing:'Đang tạo sub + voice Việt',done:'Hoàn tất',failed:'Tải thất bại',localization_failed:'Tải xong nhưng Việt hóa lỗi'};async function health(){try{const d=await fetch('/api/health').then(r=>r.json());const parts=Object.entries(d.providers||{}).map(([k,v])=>`${k}: ${v.available?'ready':'unavailable'}`);if(d.localization)parts.push(`Việt hóa: ${d.localization.enabled?(d.localization.available?'ready':'unavailable'):'off'}`);$('health').textContent=parts.join(' · ')}catch{}}$('f').onsubmit=async e=>{e.preventDefault();$('err').textContent='';$('searchBtn').disabled=true;try{const sources=[...document.querySelectorAll('input[name=src]:checked')].map(x=>x.value);const r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keyword:$('keyword').value.trim(),sources,limit:+$('limit').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Search failed');S.results=d.results||[];S.selected.clear();render();if(d.errors)$('err').textContent=Object.entries(d.errors).map(([k,v])=>`${k}: ${v}`).join('\n')}catch(e){$('err').textContent=e.message}finally{$('searchBtn').disabled=false}};function render(){$('count').textContent=`${S.results.length} kết quả`;$('downloadSelected').disabled=!S.selected.size;const host=$('results');host.replaceChildren();S.results.forEach((v,i)=>{const c=document.createElement('article');c.className='card';const img=document.createElement('img');if(v.thumbnail)img.src=v.thumbnail;else img.style.display='none';const b=document.createElement('div');b.className='body';const t=document.createElement('div');t.className='title';t.textContent=v.title||v.id;const m=document.createElement('div');m.className='meta';m.textContent=[v.platform,v.author,v.views?`${v.views} views`:null,v.likes?`${v.likes} likes`:null].filter(Boolean).join(' · ');const row=document.createElement('div');row.className='row';const lab=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.onchange=()=>{cb.checked?S.selected.add(i):S.selected.delete(i);$('downloadSelected').disabled=!S.selected.size};lab.append(cb,document.createTextNode(' chọn'));const btn=document.createElement('button');btn.textContent='Tải + Việt hóa';btn.onclick=()=>download(v,btn);row.append(lab,btn);b.append(t,m,row);c.append(img,b);host.append(c)})}async function download(v,btn){if(btn){btn.disabled=true;btn.textContent='Đã vào queue'}try{const r=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({video:v})});const d=await r.json();if(!r.ok)throw Error(d.error||'Download error');await jobs()}catch(e){$('err').textContent=e.message;if(btn){btn.disabled=false;btn.textContent='Tải + Việt hóa'}}}$('downloadSelected').onclick=async()=>{for(const i of S.selected)await download(S.results[i]);S.selected.clear();render()};async function jobs(){try{const list=await fetch('/api/jobs').then(r=>r.json());const host=$('jobs');host.replaceChildren();for(const j of list.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))){const d=document.createElement('div');d.className='job';const s=document.createElement('div');s.className='status '+(j.status==='done'?'ok':j.status.includes('failed')?'bad':'warn');s.textContent=`${statusLabel[j.status]||j.status} · ${j.video?.title||j.video?.id||''}`;d.append(s);if(j.localization){const info=document.createElement('small');info.textContent=`${j.localization.segments||0} đoạn · nguồn: ${j.localization.detectedLanguage||'?'} · output: ${j.output||''}`;d.append(info)}else if(j.output){const info=document.createElement('small');info.textContent=`Output: ${j.output}`;d.append(info)}if(j.error){const er=document.createElement('small');er.className='bad';er.textContent=j.error;d.append(er)}host.append(d)}}catch{}}$('refresh').onclick=jobs;health();jobs();setInterval(jobs,5000)</script></body></html>
