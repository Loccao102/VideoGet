<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VideoGet Affiliate Trend Hunter</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background:#0b0d11;color:#eee;margin:0}.wrap{max-width:1180px;margin:auto;padding:36px 20px}.panel,.card{background:#13171f;border:1px solid #293140;border-radius:14px}.panel{padding:18px}.search{display:grid;grid-template-columns:1fr auto;gap:10px}input,button,select{font:inherit}input[type=text],input[type=number],select{background:#0d1117;color:#fff;border:1px solid #333d4d;border-radius:9px;padding:10px}button{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer;background:#f2f2f2;color:#111}button:disabled{opacity:.45;cursor:not-allowed}.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:12px}.filters label{font-size:13px;color:#c8d0dc}.filters input[type=number]{width:90px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:20px}.card{overflow:hidden}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#080a0e}.body{padding:12px}.title{font-weight:700;min-height:44px}.meta{font-size:12px;color:#9aa7b7;margin:8px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#9aa7b7}.error{white-space:pre-wrap;color:#ffb5b5;margin-top:10px}.jobs{margin-top:28px}.job{padding:12px 0;border-top:1px solid #252c38}.job small{display:block;color:#9aa7b7;margin-top:5px;word-break:break-all}.job-actions{display:flex;gap:8px;margin-top:8px}.job-actions button{padding:7px 10px;font-size:12px}.status{font-weight:700}.ok{color:#8ee59d}.warn{color:#ffd080}.bad{color:#ff9a9a}.toolbar{margin-top:24px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip,.score{display:inline-block;border:1px solid #394457;background:#10151d;border-radius:999px;padding:4px 8px;font-size:11px;color:#cbd6e5}.score{border-color:#4a5c77}.score strong{color:#fff}.empty{padding:28px;text-align:center;color:#8190a3}.subtle{font-size:12px;color:#8190a3}@media(max-width:650px){.search{grid-template-columns:1fr}.toolbar{align-items:stretch}.actions{width:100%}.actions button{flex:1}}
  </style>
</head>
<body>
<main class="wrap">
  <h1>VideoGet <span class="subtle">Affiliate Trend Hunter</span></h1>
  <p class="muted">Tìm candidate từ Douyin/Bilibili → mở rộng keyword Trung → lọc & chấm trend → tải → sub → dịch → voice Việt.</p>

  <section class="panel">
    <form id="f">
      <div class="search">
        <input id="keyword" type="text" placeholder="đồ bếp, tẩy rửa, coffee, AI Agent..." required>
        <button id="searchBtn">Săn trend</button>
      </div>
      <div class="filters">
        <label><input type="checkbox" name="src" value="bilibili" checked> Bilibili</label>
        <label><input type="checkbox" name="src" value="douyin" checked> Douyin</label>
        <label><input id="expand" type="checkbox" checked> Mở rộng keyword Trung</label>
        <label>Kết quả <select id="limit"><option>20</option><option selected>30</option><option>50</option><option>100</option></select></label>
        <label>Sắp xếp <select id="sort"><option value="rank" selected>Affiliate score</option><option value="latest">Mới nhất</option><option value="likes">Nhiều like</option><option value="views">Nhiều view</option></select></label>
      </div>
      <div class="filters">
        <label>Min likes <input id="minLikes" type="number" min="0" value="0"></label>
        <label>Trong <select id="days"><option value="0">mọi thời gian</option><option value="1">24 giờ</option><option value="7" selected>7 ngày</option><option value="30">30 ngày</option><option value="90">90 ngày</option></select></label>
        <label>Max giây <input id="maxDuration" type="number" min="0" value="180"></label>
        <label>Auto Top <select id="topN"><option>3</option><option selected>5</option><option>10</option></select></label>
      </div>
      <div id="health" class="muted" style="margin-top:10px"></div>
      <div id="keywords" class="chips"></div>
      <div id="err" class="error"></div>
    </form>
  </section>

  <div class="toolbar">
    <div id="count" class="muted">Chưa có kết quả</div>
    <div class="actions">
      <button id="downloadTop" disabled>Tải + Việt hóa Top 5</button>
      <button id="downloadSelected" disabled>Tải đã chọn</button>
    </div>
  </div>

  <section id="results" class="grid"></section>

  <section class="panel jobs">
    <div class="row"><strong>Jobs: Download → Sub → Dịch → Voice → Render</strong><button id="refresh" type="button">Làm mới</button></div>
    <div id="jobs"></div>
  </section>
</main>
<script>
const S={results:[],selected:new Set(),keywords:[]};
const $=id=>document.getElementById(id);
const statusLabel={queued:'Đang chờ',downloading:'Đang tải',localizing:'Đang tạo sub + voice Việt',done:'Hoàn tất',failed:'Tải thất bại',localization_failed:'Tải xong nhưng Việt hóa lỗi'};
const fmt=n=>n?Intl.NumberFormat('vi',{notation:n>=10000?'compact':'standard',maximumFractionDigits:1}).format(n):'0';
const sec=n=>Number.isFinite(+n)?`${(+n).toFixed(1)}s`:'-';

async function health(){
  try{
    const d=await fetch('/api/health').then(r=>r.json());
    const parts=Object.entries(d.providers||{}).map(([k,v])=>`${k}: ${v.available?'ready':'unavailable'}`);
    if(d.localization){
      parts.push(`Việt hóa: ${d.localization.enabled?(d.localization.available?'ready':'unavailable'):'off'}`);
      if(d.localization.persistentWorker){
        const wi=d.localization.workerInfo||{};
        parts.push(`Whisper worker: ${d.localization.workerRunning?'warm':'warming'}${wi.model?` · ${wi.model}/${wi.device||'?'}`:''}`);
      }
    }
    if(d.persistence)parts.push(`SQLite: ${d.persistence.enabled?'ready':'off'} · ${d.persistence.jobs||0} jobs`);
    $('health').textContent=parts.join(' · ');
  }catch{}
}

$('f').onsubmit=async e=>{
  e.preventDefault(); $('err').textContent=''; $('searchBtn').disabled=true;
  try{
    const sources=[...document.querySelectorAll('input[name=src]:checked')].map(x=>x.value);
    const payload={
      keyword:$('keyword').value.trim(), sources, limit:+$('limit').value,
      expand:$('expand').checked, sort:$('sort').value,
      filters:{minLikes:+$('minLikes').value||0,maxDurationSec:+$('maxDuration').value||0,publishedWithinDays:+$('days').value||0}
    };
    const r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json(); if(!r.ok)throw Error(d.error||'Search failed');
    S.results=d.results||[]; S.keywords=d.keywords||[]; S.selected.clear(); render();
    if(d.errors)$('err').textContent=Object.entries(d.errors).map(([k,v])=>`${k}: ${v}`).join('\n');
  }catch(e){$('err').textContent=e.message}
  finally{$('searchBtn').disabled=false}
};

function render(){
  $('count').textContent=`${S.results.length} candidate · xếp theo ${$('sort').selectedOptions[0].textContent}`;
  $('downloadSelected').disabled=!S.selected.size;
  $('downloadTop').disabled=!S.results.length;
  $('downloadTop').textContent=`Tải + Việt hóa Top ${$('topN').value}`;
  const kh=$('keywords'); kh.replaceChildren();
  for(const k of S.keywords){const el=document.createElement('span');el.className='chip';el.textContent=k;kh.append(el)}
  const host=$('results'); host.replaceChildren();
  if(!S.results.length){const e=document.createElement('div');e.className='empty';e.textContent='Không có candidate phù hợp với filter hiện tại.';host.append(e);return}
  S.results.forEach((v,i)=>{
    const c=document.createElement('article');c.className='card';
    const img=document.createElement('img');if(v.thumbnail)img.src=v.thumbnail;else img.style.display='none';
    const b=document.createElement('div');b.className='body';
    const t=document.createElement('div');t.className='title';t.textContent=`#${i+1} ${v.title||v.id}`;
    const m=document.createElement('div');m.className='meta';m.textContent=[v.platform,v.author,v.views?`${fmt(v.views)} views`:null,v.likes?`${fmt(v.likes)} likes`:null,v.durationSec?`${v.durationSec}s`:null].filter(Boolean).join(' · ');
    const scores=document.createElement('div');scores.className='chips';
    if(v.scores){scores.innerHTML=`<span class="score"><strong>${v.scores.overall}</strong> overall</span><span class="score">${v.scores.trend} trend</span><span class="score">${v.scores.relevance} relevant</span>`}
    const src=document.createElement('div');src.className='subtle';src.style.marginTop='8px';src.textContent=v.searchSource?`match: ${v.searchSource}`:'';
    const row=document.createElement('div');row.className='row';row.style.marginTop='10px';
    const lab=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.onchange=()=>{cb.checked?S.selected.add(i):S.selected.delete(i);$('downloadSelected').disabled=!S.selected.size};lab.append(cb,document.createTextNode(' chọn'));
    const btn=document.createElement('button');btn.textContent='Tải + Việt hóa';btn.onclick=()=>download(v,btn);row.append(lab,btn);
    b.append(t,m,scores,src,row);c.append(img,b);host.append(c);
  });
}

async function download(v,btn){
  if(btn){btn.disabled=true;btn.textContent='Đã vào queue'}
  try{
    const r=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({video:v})});
    const d=await r.json();if(!r.ok)throw Error(d.error||'Download error');await jobs();
  }catch(e){$('err').textContent=e.message;if(btn){btn.disabled=false;btn.textContent='Tải + Việt hóa'}}
}

async function retryJob(id,btn){
  btn.disabled=true;btn.textContent='Đang xếp lại...';
  try{
    const r=await fetch(`/api/jobs/${encodeURIComponent(id)}/retry`,{method:'POST'});
    const d=await r.json();if(!r.ok)throw Error(d.error||'Retry error');await jobs();
  }catch(e){$('err').textContent=e.message;btn.disabled=false;btn.textContent='Thử lại'}
}

$('downloadSelected').onclick=async()=>{for(const i of S.selected)await download(S.results[i]);S.selected.clear();render()};
$('downloadTop').onclick=async()=>{const n=Math.min(+$('topN').value,S.results.length);$('downloadTop').disabled=true;for(let i=0;i<n;i++)await download(S.results[i]);await jobs();render()};
$('topN').onchange=()=>render();

async function jobs(){
  try{
    const list=await fetch('/api/jobs').then(r=>r.json());const host=$('jobs');host.replaceChildren();
    for(const j of list){
      const d=document.createElement('div');d.className='job';
      const s=document.createElement('div');s.className='status '+(j.status==='done'?'ok':j.status.includes('failed')?'bad':'warn');s.textContent=`${statusLabel[j.status]||j.status} · ${j.video?.title||j.video?.id||''}`;d.append(s);
      const attempt=document.createElement('small');attempt.textContent=`Job ${j.id} · lần chạy ${j.attempts||1}`;d.append(attempt);
      if(j.localization){
        const info=document.createElement('small');info.textContent=`${j.localization.segments||0} đoạn · nguồn: ${j.localization.detectedLanguage||'?'} · ${j.localization.worker?'persistent worker':'one-shot'} · output: ${j.output||''}`;d.append(info);
        if(j.localization.timings){
          const t=j.localization.timings;
          const perf=document.createElement('small');
          perf.textContent=`Hiệu năng: Whisper ${sec(t.transcribe)} · Dịch ${sec(t.translate)} · TTS ${sec(t.tts)} · Render ${sec(t.render)} · Tổng ${sec(t.total)}`;
          d.append(perf);
        }
        if(j.localization.cacheHits?.length){
          const cache=document.createElement('small');cache.className='ok';cache.textContent=`Cache hit: ${j.localization.cacheHits.join(', ')}`;d.append(cache);
        }
      } else if(j.output){const info=document.createElement('small');info.textContent=`Output: ${j.output}`;d.append(info)}
      if(j.error){const er=document.createElement('small');er.className='bad';er.textContent=j.error;d.append(er)}
      if(j.status==='failed'||j.status==='localization_failed'){
        const actions=document.createElement('div');actions.className='job-actions';
        const retry=document.createElement('button');retry.textContent='Thử lại';retry.onclick=()=>retryJob(j.id,retry);actions.append(retry);d.append(actions)
      }
      host.append(d)
    }
  }catch{}
}
$('refresh').onclick=jobs;health();jobs();setInterval(()=>{jobs();health()},5000);
</script>
</body>
</html>
