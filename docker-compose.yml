services:
  videoget:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DOWNLOAD_DIR: "/app/downloads"
      JOB_DB_PATH: "${JOB_DB_PATH:-/app/downloads/videoget.db}"
      DOWNLOAD_CONCURRENCY: "${DOWNLOAD_CONCURRENCY:-3}"
      JOB_TIMEOUT_MINUTES: "${JOB_TIMEOUT_MINUTES:-180}"
      DOUYIN_MODE: "${DOUYIN_MODE:-auto}"
      DOUYIN_COOKIE: "${DOUYIN_COOKIE:-}"
      DOUYIN_BIN: "${DOUYIN_BIN:-douyin}"
      DOUYIN_AUTH_TIMEOUT_SEC: "${DOUYIN_AUTH_TIMEOUT_SEC:-40}"
      DOUYIN_GUEST_CLI_TIMEOUT_SEC: "${DOUYIN_GUEST_CLI_TIMEOUT_SEC:-18}"
      DOUYIN_GUEST_TIMEOUT_SEC: "${DOUYIN_GUEST_TIMEOUT_SEC:-20}"
      DOUYIN_GUEST_SEARCH_URL: "${DOUYIN_GUEST_SEARCH_URL:-}"
      DOUYIN_GUEST_USER_AGENT: "${DOUYIN_GUEST_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36}"
      BILIBILI_COOKIE: "${BILIBILI_COOKIE:-}"
      BILIBILI_BIN: "${BILIBILI_BIN:-bili}"
      BILIBILI_SEARCH_DELAY_MS: "${BILIBILI_SEARCH_DELAY_MS:-1200}"
      BILIBILI_REQUEST_RATE: "${BILIBILI_REQUEST_RATE:-800ms}"
      BILIBILI_RETRIES: "${BILIBILI_RETRIES:-2}"
      BILIBILI_DOWNLOAD_ATTEMPTS: "${BILIBILI_DOWNLOAD_ATTEMPTS:-3}"
      BILIBILI_USER_AGENT: "${BILIBILI_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36}"
      AUTO_FREE_SOURCES: "${AUTO_FREE_SOURCES:-true}"
      FREE_SHORT_SOURCES: "${FREE_SHORT_SOURCES:-kuaishou,xiaohongshu,weibo,xigua,haokan,toutiao,acfun,meipai,weishi}"
      PUBLIC_SOURCE_KEYWORD_LIMIT: "${PUBLIC_SOURCE_KEYWORD_LIMIT:-3}"
      PUBLIC_INDEX_CONCURRENCY: "${PUBLIC_INDEX_CONCURRENCY:-6}"
      PUBLIC_INDEX_TIMEOUT_SEC: "${PUBLIC_INDEX_TIMEOUT_SEC:-10}"
      PUBLIC_INDEX_USER_AGENT: "${PUBLIC_INDEX_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36}"
      PUBLIC_DOWNLOAD_ATTEMPTS: "${PUBLIC_DOWNLOAD_ATTEMPTS:-2}"
      PUBLIC_DOWNLOAD_USER_AGENT: "${PUBLIC_DOWNLOAD_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36}"
      PREVIEW_CONCURRENCY: "${PREVIEW_CONCURRENCY:-4}"
      PREVIEW_PAGE_TIMEOUT_SEC: "${PREVIEW_PAGE_TIMEOUT_SEC:-5}"
      PREVIEW_YTDLP_TIMEOUT_SEC: "${PREVIEW_YTDLP_TIMEOUT_SEC:-12}"
      PREVIEW_DEEP_METADATA: "${PREVIEW_DEEP_METADATA:-false}"
      PREVIEW_USER_AGENT: "${PREVIEW_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36}"
      KEYWORD_EXPANDER: "${KEYWORD_EXPANDER:-ollama}"
      AUTO_LOCALIZE: "${AUTO_LOCALIZE:-true}"
      LOCALIZE_SCRIPT: "/app/scripts/localize_smart.py"
      LOCALIZE_CONCURRENCY: "${LOCALIZE_CONCURRENCY:-1}"
      LOCALIZE_PERSISTENT_WORKER: "${LOCALIZE_PERSISTENT_WORKER:-true}"
      LOCALIZE_WORKER_SCRIPT: "/app/scripts/localize_worker_smart.py"
      LOCALIZE_WORKER_FALLBACK: "${LOCALIZE_WORKER_FALLBACK:-true}"
      LOCALIZE_WORKER_PREWARM: "${LOCALIZE_WORKER_PREWARM:-true}"
      LOCALIZE_WORKER_START_TIMEOUT_SEC: "${LOCALIZE_WORKER_START_TIMEOUT_SEC:-600}"
      WHISPER_MODEL: "${WHISPER_MODEL:-small}"
      WHISPER_DEVICE: "${WHISPER_DEVICE:-cpu}"
      WHISPER_COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-int8}"
      WHISPER_LANGUAGE: "${WHISPER_LANGUAGE:-zh}"
      WHISPER_BEAM_SIZE: "${WHISPER_BEAM_SIZE:-1}"
      WHISPER_CPU_THREADS: "${WHISPER_CPU_THREADS:-8}"
      WHISPER_NUM_WORKERS: "${WHISPER_NUM_WORKERS:-1}"
      WHISPER_DIRECT_DECODE: "${WHISPER_DIRECT_DECODE:-true}"
      WHISPER_CONDITION_PREVIOUS_TEXT: "${WHISPER_CONDITION_PREVIOUS_TEXT:-true}"
      WHISPER_USE_TITLE_PROMPT: "${WHISPER_USE_TITLE_PROMPT:-true}"
      HF_TOKEN: "${HF_TOKEN:-}"
      TRANSLATE_PROVIDER: "${TRANSLATE_PROVIDER:-ollama}"
      TRANSLATE_STYLE: "${TRANSLATE_STYLE:-natural_social}"
      TRANSLATE_BATCH_SIZE: "${TRANSLATE_BATCH_SIZE:-10}"
      TRANSLATE_CONTEXT_SEGMENTS: "${TRANSLATE_CONTEXT_SEGMENTS:-3}"
      TRANSLATE_TEMPERATURE: "${TRANSLATE_TEMPERATURE:-0.15}"
      TRANSLATE_TIMEOUT_SEC: "${TRANSLATE_TIMEOUT_SEC:-180}"
      TRANSLATE_RETRIES: "${TRANSLATE_RETRIES:-2}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:8b}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-15m}"
      OPENAI_COMPAT_BASE_URL: "${OPENAI_COMPAT_BASE_URL:-}"
      OPENAI_COMPAT_MODEL: "${OPENAI_COMPAT_MODEL:-}"
      OPENAI_COMPAT_API_KEY: "${OPENAI_COMPAT_API_KEY:-}"
      TTS_VOICE: "${TTS_VOICE:-vi-VN-HoaiMyNeural}"
      TTS_RATE: "${TTS_RATE:-+8%}"
      TTS_MAX_SPEED: "${TTS_MAX_SPEED:-2.0}"
      TTS_CONCURRENCY: "${TTS_CONCURRENCY:-2}"
      TTS_RETRIES: "${TTS_RETRIES:-4}"
      TTS_REQUEST_TIMEOUT_SEC: "${TTS_REQUEST_TIMEOUT_SEC:-75}"
      TTS_GROUP_MAX_CHARS: "${TTS_GROUP_MAX_CHARS:-180}"
      TTS_GROUP_MAX_DURATION_SEC: "${TTS_GROUP_MAX_DURATION_SEC:-10}"
      TTS_GROUP_MAX_GAP_SEC: "${TTS_GROUP_MAX_GAP_SEC:-1.2}"
      TTS_FALLBACK_MAX_CHARS: "${TTS_FALLBACK_MAX_CHARS:-90}"
      BURN_SUBTITLES: "${BURN_SUBTITLES:-true}"
      VIDEO_CLEANUP: "${VIDEO_CLEANUP:-true}"
      # safe = no source cleanup; smart = conservative auto-detect; aggressive = more sensitive; legacy = old fixed masks.
      VIDEO_CLEANUP_MODE: "${VIDEO_CLEANUP_MODE:-smart}"
      VIDEO_ANALYSIS_SAMPLES: "${VIDEO_ANALYSIS_SAMPLES:-12}"
      VIDEO_CLEANUP_SOURCE_SUBTITLES: "${VIDEO_CLEANUP_SOURCE_SUBTITLES:-true}"
      VIDEO_CLEANUP_LOGOS: "${VIDEO_CLEANUP_LOGOS:-true}"
      VIDEO_SOURCE_SUBTITLE_BLUR: "${VIDEO_SOURCE_SUBTITLE_BLUR:-8}"
      VIDEO_SOURCE_SUBTITLE_REGION: "${VIDEO_SOURCE_SUBTITLE_REGION:-}"
      VIDEO_MANUAL_LOGO_REGIONS: "${VIDEO_MANUAL_LOGO_REGIONS:-}"
      VIDEO_SUBTITLE_FONT: "${VIDEO_SUBTITLE_FONT:-Noto Sans}"
      VIDEO_SUBTITLE_FONT_SIZE: "${VIDEO_SUBTITLE_FONT_SIZE:-0}"
      VIDEO_SUBTITLE_BOX_ALPHA: "${VIDEO_SUBTITLE_BOX_ALPHA:-0.58}"
      VIDEO_SUBTITLE_BOX_PADDING: "${VIDEO_SUBTITLE_BOX_PADDING:-7}"
      VIDEO_SUBTITLE_WRAP_CHARS: "${VIDEO_SUBTITLE_WRAP_CHARS:-0}"
      VIDEO_SUBTITLE_MAX_LINES: "${VIDEO_SUBTITLE_MAX_LINES:-2}"
      # Legacy-only masks kept for rollback/debug. SMART ignores them unless you use the new manual override vars above.
      VIDEO_LOGO_MASKS: "${VIDEO_LOGO_MASKS:-0.76,0.02,0.22,0.10;0.76,0.86,0.22,0.12}"
      VIDEO_SUBTITLE_MASK_X: "${VIDEO_SUBTITLE_MASK_X:-0.02}"
      VIDEO_SUBTITLE_MASK_Y: "${VIDEO_SUBTITLE_MASK_Y:-0.72}"
      VIDEO_SUBTITLE_MASK_W: "${VIDEO_SUBTITLE_MASK_W:-0.96}"
      VIDEO_SUBTITLE_MASK_H: "${VIDEO_SUBTITLE_MASK_H:-0.24}"
      VIDEO_COLOR_GRADE: "${VIDEO_COLOR_GRADE:-true}"
      VIDEO_CONTRAST: "${VIDEO_CONTRAST:-1.03}"
      VIDEO_SATURATION: "${VIDEO_SATURATION:-1.05}"
      VIDEO_BRIGHTNESS: "${VIDEO_BRIGHTNESS:-0.005}"
      VIDEO_PRESET: "${VIDEO_PRESET:-veryfast}"
      VIDEO_CRF: "${VIDEO_CRF:-21}"
      ORIGINAL_AUDIO_VOLUME: "${ORIGINAL_AUDIO_VOLUME:-0.08}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./downloads:/app/downloads
      - whisper-cache:/root/.cache
    restart: unless-stopped

volumes:
  whisper-cache:
