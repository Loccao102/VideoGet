services:
  videoget:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DOWNLOAD_DIR: "/app/downloads"
      JOB_DB_PATH: "${JOB_DB_PATH:-/app/downloads/videoget.db}"
      DOWNLOAD_CONCURRENCY: "${DOWNLOAD_CONCURRENCY:-3}"
      JOB_TIMEOUT_MINUTES: "${JOB_TIMEOUT_MINUTES:-180}"
      SEARCH_KEYWORD_LIMIT: "${SEARCH_KEYWORD_LIMIT:-4}"
      DOUYIN_COOKIE: "${DOUYIN_COOKIE:-}"
      DOUYIN_SEARCH_TIMEOUT_SEC: "${DOUYIN_SEARCH_TIMEOUT_SEC:-20}"
      DOUYIN_SEARCH_URL: "${DOUYIN_SEARCH_URL:-}"
      DOUYIN_NATIVE_SEARCH: "${DOUYIN_NATIVE_SEARCH:-true}"
      DOUYIN_NATIVE_SEARCH_SCRIPT: "/app/scripts/douyin_search_browser_v2.py"
      DOUYIN_NATIVE_SEARCH_TIMEOUT_SEC: "${DOUYIN_NATIVE_SEARCH_TIMEOUT_SEC:-25}"
      DOUYIN_NATIVE_SEARCH_RENDER_MS: "${DOUYIN_NATIVE_SEARCH_RENDER_MS:-8000}"
      DOUYIN_NATIVE_SEARCH_SCROLLS: "${DOUYIN_NATIVE_SEARCH_SCROLLS:-2}"
      DOUYIN_NATIVE_SEARCH_MAX_PAGES: "${DOUYIN_NATIVE_SEARCH_MAX_PAGES:-3}"
      DOUYIN_NATIVE_SEARCH_DOM_MAX_MB: "${DOUYIN_NATIVE_SEARCH_DOM_MAX_MB:-32}"
      DOUYIN_NATIVE_SEARCH_PROFILE_DIR: "${DOUYIN_NATIVE_SEARCH_PROFILE_DIR:-}"
      DOUYIN_USER_AGENT: "${DOUYIN_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36}"
      DOUYIN_MOBILE_USER_AGENT: "${DOUYIN_MOBILE_USER_AGENT:-Mozilla/5.0 (iPhone; CPU iPhone OS 16_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.6 Mobile/15E148 Safari/604.1}"
      DOUYIN_RESOLVE_TIMEOUT_SEC: "${DOUYIN_RESOLVE_TIMEOUT_SEC:-18}"
      DOUYIN_PAGE_TIMEOUT_SEC: "${DOUYIN_PAGE_TIMEOUT_SEC:-25}"
      DOUYIN_MEDIA_TIMEOUT_SEC: "${DOUYIN_MEDIA_TIMEOUT_SEC:-120}"
      DOUYIN_MEDIA_CANDIDATES: "${DOUYIN_MEDIA_CANDIDATES:-12}"
      DOUYIN_PREFER_ORIGINAL: "${DOUYIN_PREFER_ORIGINAL:-false}"
      DOUYIN_BROWSER_FALLBACK: "${DOUYIN_BROWSER_FALLBACK:-true}"
      DOUYIN_BROWSER_BIN: "${DOUYIN_BROWSER_BIN:-chromium}"
      DOUYIN_BROWSER_TIMEOUT_SEC: "${DOUYIN_BROWSER_TIMEOUT_SEC:-45}"
      DOUYIN_BROWSER_RENDER_MS: "${DOUYIN_BROWSER_RENDER_MS:-10000}"
      DOUYIN_BROWSER_DOM_MAX_MB: "${DOUYIN_BROWSER_DOM_MAX_MB:-24}"
      DOUYIN_BROWSER_NO_SANDBOX: "${DOUYIN_BROWSER_NO_SANDBOX:-true}"
      DOUYIN_BROWSER_PROFILE_DIR: "${DOUYIN_BROWSER_PROFILE_DIR:-}"
      DOUYIN_BROWSER_EXTRA_ARGS: "${DOUYIN_BROWSER_EXTRA_ARGS:-}"
      BILIBILI_COOKIE: "${BILIBILI_COOKIE:-}"
      BILIBILI_BIN: "${BILIBILI_BIN:-bili}"
      BILIBILI_SEARCH_DELAY_MS: "${BILIBILI_SEARCH_DELAY_MS:-1200}"
      BILIBILI_REQUEST_RATE: "${BILIBILI_REQUEST_RATE:-800ms}"
      BILIBILI_RETRIES: "${BILIBILI_RETRIES:-2}"
      BILIBILI_DOWNLOAD_ATTEMPTS: "${BILIBILI_DOWNLOAD_ATTEMPTS:-3}"
      BILIBILI_USER_AGENT: "${BILIBILI_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36}"
      AUTO_FREE_SOURCES: "${AUTO_FREE_SOURCES:-true}"
      FREE_SHORT_SOURCES: "${FREE_SHORT_SOURCES:-kuaishou,xiaohongshu,weibo,xigua,haokan,toutiao,acfun,meipai,weishi}"
      PUBLIC_SOURCE_KEYWORD_LIMIT: "${PUBLIC_SOURCE_KEYWORD_LIMIT:-3}"
      PUBLIC_INDEX_CONCURRENCY: "${PUBLIC_INDEX_CONCURRENCY:-6}"
      PUBLIC_INDEX_TIMEOUT_SEC: "${PUBLIC_INDEX_TIMEOUT_SEC:-10}"
      PUBLIC_INDEX_USER_AGENT: "${PUBLIC_INDEX_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36}"
      PUBLIC_DOWNLOAD_ATTEMPTS: "${PUBLIC_DOWNLOAD_ATTEMPTS:-2}"
      PUBLIC_DOWNLOAD_USER_AGENT: "${PUBLIC_DOWNLOAD_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36}"
      PREVIEW_CONCURRENCY: "${PREVIEW_CONCURRENCY:-4}"
      PREVIEW_PAGE_TIMEOUT_SEC: "${PREVIEW_PAGE_TIMEOUT_SEC:-5}"
      PREVIEW_YTDLP_TIMEOUT_SEC: "${PREVIEW_YTDLP_TIMEOUT_SEC:-12}"
      PREVIEW_DEEP_METADATA: "${PREVIEW_DEEP_METADATA:-false}"
      PREVIEW_USER_AGENT: "${PREVIEW_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36}"
      KEYWORD_EXPANDER: "${KEYWORD_EXPANDER:-ollama}"
      KEYWORD_EXPANDER_STRICT: "${KEYWORD_EXPANDER_STRICT:-false}"
      OLLAMA_KEYWORD_TIMEOUT_SEC: "${OLLAMA_KEYWORD_TIMEOUT_SEC:-20}"
      AUTO_LOCALIZE: "${AUTO_LOCALIZE:-true}"
      LOCALIZE_SCRIPT: "/app/scripts/localize_smart.py"
      LOCALIZE_CONCURRENCY: "${LOCALIZE_CONCURRENCY:-1}"
      LOCALIZE_PERSISTENT_WORKER: "${LOCALIZE_PERSISTENT_WORKER:-true}"
      LOCALIZE_WORKER_SCRIPT: "/app/scripts/localize_worker_smart.py"
      LOCALIZE_WORKER_FALLBACK: "${LOCALIZE_WORKER_FALLBACK:-true}"
      LOCALIZE_WORKER_PREWARM: "${LOCALIZE_WORKER_PREWARM:-true}"
      LOCALIZE_WORKER_START_TIMEOUT_SEC: "${LOCALIZE_WORKER_START_TIMEOUT_SEC:-600}"
      OCR_MUSIC_SCRIPT: "/app/scripts/localize_ocr_music_branded.py"
      VIDEGET_QUALITY_TIER: "${VIDEGET_QUALITY_TIER:-medium}"
      OCR_MODEL_SIZE: "${OCR_MODEL_SIZE:-small}"
      OCR_FPS: "${OCR_FPS:-3}"
      OCR_CONSENSUS_SIMILARITY: "${OCR_CONSENSUS_SIMILARITY:-0.72}"
      OCR_LINE_Y_TOLERANCE: "${OCR_LINE_Y_TOLERANCE:-0.045}"
      OCR_TWO_LINE_MAX_GAP: "${OCR_TWO_LINE_MAX_GAP:-0.15}"
      OCR_REFINEMENT_ENABLED: "${OCR_REFINEMENT_ENABLED:-true}"
      OCR_REFINEMENT_MODEL_SIZE: "${OCR_REFINEMENT_MODEL_SIZE:-medium}"
      OCR_REFINEMENT_TRIGGER_CONFIDENCE: "${OCR_REFINEMENT_TRIGGER_CONFIDENCE:-0.72}"
      OCR_REFINEMENT_TRIGGER_CONSENSUS: "${OCR_REFINEMENT_TRIGGER_CONSENSUS:-0.67}"
      OCR_REFINEMENT_TRIGGER_OBSERVATIONS: "${OCR_REFINEMENT_TRIGGER_OBSERVATIONS:-2}"
      OCR_REFINEMENT_MAX_SEGMENTS: "${OCR_REFINEMENT_MAX_SEGMENTS:-16}"
      OCR_REFINEMENT_SAMPLES: "${OCR_REFINEMENT_SAMPLES:-3}"
      OCR_REFINEMENT_MIN_CONFIDENCE: "${OCR_REFINEMENT_MIN_CONFIDENCE:-0.50}"
      OCR_CLEANUP_TEMPORAL_OVERLAP: "${OCR_CLEANUP_TEMPORAL_OVERLAP:-0.28}"
      OCR_CLEANUP_PAD_X: "${OCR_CLEANUP_PAD_X:-0.010}"
      OCR_CLEANUP_PAD_Y: "${OCR_CLEANUP_PAD_Y:-0.008}"
      OCR_CLEANUP_MAX_REGIONS: "${OCR_CLEANUP_MAX_REGIONS:-10}"
      OCR_SOURCE_CLEANUP_MODE: "${OCR_SOURCE_CLEANUP_MODE:-cover}"
      OCR_SOURCE_CLEANUP_ALPHA: "${OCR_SOURCE_CLEANUP_ALPHA:-0.94}"
      OCR_MAX_SAMPLES: "${OCR_MAX_SAMPLES:-900}"
      OCR_MIN_CONFIDENCE: "${OCR_MIN_CONFIDENCE:-0.65}"
      OCR_MIN_TEXT_CHARS: "${OCR_MIN_TEXT_CHARS:-2}"
      OCR_MIN_DURATION_SEC: "${OCR_MIN_DURATION_SEC:-0.35}"
      OCR_TEXT_SIMILARITY: "${OCR_TEXT_SIMILARITY:-0.78}"
      OCR_MAX_GAP_SEC: "${OCR_MAX_GAP_SEC:-0.9}"
      OCR_IGNORE_PERSISTENT_SEC: "${OCR_IGNORE_PERSISTENT_SEC:-12}"
      OCR_SUBTITLE_REGION: "${OCR_SUBTITLE_REGION:-auto}"
      OCR_LAYOUT_MIN_CONFIDENCE: "${OCR_LAYOUT_MIN_CONFIDENCE:-0.58}"
      OCR_SOURCE_LANGUAGE: "${OCR_SOURCE_LANGUAGE:-zh}"
      OCR_TRANSLATE: "${OCR_TRANSLATE:-true}"
      OCR_REMOVE_SOURCE_TEXT: "${OCR_REMOVE_SOURCE_TEXT:-true}"
      OCR_RENDER_CRF: "${OCR_RENDER_CRF:-18}"
      OCR_RENDER_PRESET: "${OCR_RENDER_PRESET:-}"
      OCR_KEEP_SUBBED_INTERMEDIATE: "${OCR_KEEP_SUBBED_INTERMEDIATE:-false}"
      OCR_OVERLAY_HIDE_BILIBILI: "${OCR_OVERLAY_HIDE_BILIBILI:-true}"
      OCR_OVERLAY_BILIBILI_AUTO_DETECT: "${OCR_OVERLAY_BILIBILI_AUTO_DETECT:-true}"
      OCR_OVERLAY_BILIBILI_DECODE_PROXY: "${OCR_OVERLAY_BILIBILI_DECODE_PROXY:-true}"
      OCR_OVERLAY_BILIBILI_SAMPLES: "${OCR_OVERLAY_BILIBILI_SAMPLES:-6}"
      OCR_OVERLAY_BILIBILI_TOP_BAND: "${OCR_OVERLAY_BILIBILI_TOP_BAND:-0.20}"
      OCR_OVERLAY_BILIBILI_OCR_CONFIDENCE: "${OCR_OVERLAY_BILIBILI_OCR_CONFIDENCE:-0.48}"
      OCR_OVERLAY_BILIBILI_MIN_HITS: "${OCR_OVERLAY_BILIBILI_MIN_HITS:-2}"
      OCR_OVERLAY_BILIBILI_BLUR: "${OCR_OVERLAY_BILIBILI_BLUR:-17}"
      OCR_OVERLAY_BILIBILI_REDETECT: "${OCR_OVERLAY_BILIBILI_REDETECT:-false}"
      OCR_OVERLAY_BILIBILI_MANUAL_REGIONS: "${OCR_OVERLAY_BILIBILI_MANUAL_REGIONS:-}"
      OCR_OVERLAY_BILIBILI_REGIONS: "${OCR_OVERLAY_BILIBILI_REGIONS:-}"
      BRAND_WATERMARK_ENABLED: "${BRAND_WATERMARK_ENABLED:-true}"
      BRAND_WATERMARK_TEXT: "${BRAND_WATERMARK_TEXT:-Xứ Sở Nhiều Lông}"
      BRAND_WATERMARK_ASSET: "${BRAND_WATERMARK_ASSET:-}"
      BRAND_WATERMARK_WIDTH: "${BRAND_WATERMARK_WIDTH:-0.20}"
      BRAND_WATERMARK_MARGIN_X: "${BRAND_WATERMARK_MARGIN_X:-0.012}"
      BRAND_WATERMARK_MARGIN_Y: "${BRAND_WATERMARK_MARGIN_Y:-0.012}"
      OCR_MUSIC_DIR: "${OCR_MUSIC_DIR:-/app/assets/music}"
      OCR_MUSIC_FILE: "${OCR_MUSIC_FILE:-}"
      OCR_MUSIC_REQUIRED: "${OCR_MUSIC_REQUIRED:-true}"
      OCR_MUSIC_VOLUME: "${OCR_MUSIC_VOLUME:-0.18}"
      OCR_MUSIC_FADE_IN_SEC: "${OCR_MUSIC_FADE_IN_SEC:-0.8}"
      OCR_MUSIC_FADE_OUT_SEC: "${OCR_MUSIC_FADE_OUT_SEC:-1.5}"
      OCR_ORIGINAL_AUDIO_MODE: "${OCR_ORIGINAL_AUDIO_MODE:-mute}"
      OCR_ORIGINAL_AUDIO_VOLUME: "${OCR_ORIGINAL_AUDIO_VOLUME:-0.08}"
      OCR_MUSIC_AUDIO_BITRATE: "${OCR_MUSIC_AUDIO_BITRATE:-192k}"
      WHISPER_MODEL: "${WHISPER_MODEL:-small}"
      WHISPER_DEVICE: "${WHISPER_DEVICE:-cpu}"
      WHISPER_COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-int8}"
      WHISPER_LANGUAGE: "${WHISPER_LANGUAGE:-zh}"
      WHISPER_BEAM_SIZE: "${WHISPER_BEAM_SIZE:-1}"
      WHISPER_CPU_THREADS: "${WHISPER_CPU_THREADS:-8}"
      WHISPER_NUM_WORKERS: "${WHISPER_NUM_WORKERS:-1}"
      WHISPER_DIRECT_DECODE: "${WHISPER_DIRECT_DECODE:-true}"
      WHISPER_CONDITION_PREVIOUS_TEXT: "${WHISPER_CONDITION_PREVIOUS_TEXT:-true}"
      WHISPER_USE_TITLE_PROMPT: "${WHISPER_USE_TITLE_PROMPT:-true}"
      HF_TOKEN: "${HF_TOKEN:-}"
      TRANSLATE_PROVIDER: "${TRANSLATE_PROVIDER:-ollama}"
      TRANSLATE_STYLE: "${TRANSLATE_STYLE:-natural_social}"
      TRANSLATE_BATCH_SIZE: "${TRANSLATE_BATCH_SIZE:-10}"
      TRANSLATE_CONTEXT_SEGMENTS: "${TRANSLATE_CONTEXT_SEGMENTS:-3}"
      TRANSLATE_TEMPERATURE: "${TRANSLATE_TEMPERATURE:-0.15}"
      TRANSLATE_TIMEOUT_SEC: "${TRANSLATE_TIMEOUT_SEC:-180}"
      TRANSLATE_RETRIES: "${TRANSLATE_RETRIES:-2}"
      TRANSLATE_REPAIR_ON_HAN: "${TRANSLATE_REPAIR_ON_HAN:-true}"
      TRANSLATE_REPAIR_MODEL: "${TRANSLATE_REPAIR_MODEL:-}"
      TRANSLATE_REPAIR_KEEP_ALIVE: "${TRANSLATE_REPAIR_KEEP_ALIVE:-2m}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:8b}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-15m}"
      OPENAI_COMPAT_BASE_URL: "${OPENAI_COMPAT_BASE_URL:-}"
      OPENAI_COMPAT_MODEL: "${OPENAI_COMPAT_MODEL:-}"
      OPENAI_COMPAT_API_KEY: "${OPENAI_COMPAT_API_KEY:-}"
      TTS_VOICE: "${TTS_VOICE:-vi-VN-HoaiMyNeural}"
      TTS_RATE: "${TTS_RATE:-+8%}"
      TTS_MAX_SPEED: "${TTS_MAX_SPEED:-2.0}"
      TTS_CONCURRENCY: "${TTS_CONCURRENCY:-2}"
      TTS_RETRIES: "${TTS_RETRIES:-4}"
      TTS_REQUEST_TIMEOUT_SEC: "${TTS_REQUEST_TIMEOUT_SEC:-75}"
      TTS_GROUP_MAX_CHARS: "${TTS_GROUP_MAX_CHARS:-180}"
      TTS_GROUP_MAX_DURATION_SEC: "${TTS_GROUP_MAX_DURATION_SEC:-10}"
      TTS_GROUP_MAX_GAP_SEC: "${TTS_GROUP_MAX_GAP_SEC:-1.2}"
      TTS_FALLBACK_MAX_CHARS: "${TTS_FALLBACK_MAX_CHARS:-90}"
      BURN_SUBTITLES: "${BURN_SUBTITLES:-true}"
      VIDEO_CLEANUP: "${VIDEO_CLEANUP:-true}"
      VIDEO_CLEANUP_MODE: "${VIDEO_CLEANUP_MODE:-smart}"
      VIDEO_ANALYSIS_SAMPLES: "${VIDEO_ANALYSIS_SAMPLES:-12}"
      VIDEO_CLEANUP_SOURCE_SUBTITLES: "${VIDEO_CLEANUP_SOURCE_SUBTITLES:-true}"
      VIDEO_CLEANUP_LOGOS: "${VIDEO_CLEANUP_LOGOS:-true}"
      VIDEO_SOURCE_SUBTITLE_BLUR: "${VIDEO_SOURCE_SUBTITLE_BLUR:-8}"
      VIDEO_SOURCE_SUBTITLE_REGION: "${VIDEO_SOURCE_SUBTITLE_REGION:-}"
      VIDEO_MANUAL_LOGO_REGIONS: "${VIDEO_MANUAL_LOGO_REGIONS:-}"
      VIDEO_SUBTITLE_FONT: "${VIDEO_SUBTITLE_FONT:-Noto Sans}"
      VIDEO_SUBTITLE_FONT_SIZE: "${VIDEO_SUBTITLE_FONT_SIZE:-}"
      VIDEO_SUBTITLE_BOX_ALPHA: "${VIDEO_SUBTITLE_BOX_ALPHA:-0.58}"
      VIDEO_SUBTITLE_BOX_PADDING: "${VIDEO_SUBTITLE_BOX_PADDING:-7}"
      VIDEO_SUBTITLE_WRAP_CHARS: "${VIDEO_SUBTITLE_WRAP_CHARS:-}"
      VIDEO_SUBTITLE_MAX_LINES: "${VIDEO_SUBTITLE_MAX_LINES:-2}"
      VIDEO_LOGO_MASKS: "${VIDEO_LOGO_MASKS:-0.76,0.02,0.22,0.10;0.76,0.86,0.22,0.12}"
      VIDEO_SUBTITLE_MASK_X: "${VIDEO_SUBTITLE_MASK_X:-0.02}"
      VIDEO_SUBTITLE_MASK_Y: "${VIDEO_SUBTITLE_MASK_Y:-0.72}"
      VIDEO_SUBTITLE_MASK_W: "${VIDEO_SUBTITLE_MASK_W:-0.96}"
      VIDEO_SUBTITLE_MASK_H: "${VIDEO_SUBTITLE_MASK_H:-0.24}"
      VIDEO_COLOR_GRADE: "${VIDEO_COLOR_GRADE:-true}"
      VIDEO_CONTRAST: "${VIDEO_CONTRAST:-1.03}"
      VIDEO_SATURATION: "${VIDEO_SATURATION:-1.05}"
      VIDEO_BRIGHTNESS: "${VIDEO_BRIGHTNESS:-0.005}"
      VIDEO_PRESET: "${VIDEO_PRESET:-veryfast}"
      VIDEO_CRF: "${VIDEO_CRF:-21}"
      ORIGINAL_AUDIO_VOLUME: "${ORIGINAL_AUDIO_VOLUME:-0.08}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./downloads:/app/downloads
      - ./assets/music:/app/assets/music:ro
      - whisper-cache:/root/.cache
    restart: unless-stopped

volumes:
  whisper-cache:
