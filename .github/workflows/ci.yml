name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Go module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - run: python -m py_compile scripts/localize.py scripts/localize_fast.py
      - name: Validate Dockerfile
        run: docker buildx build --check .
