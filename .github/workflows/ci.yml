name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Go module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: OCR decode proxy regression
        run: python scripts/test_ocr_decode_proxy.py
      - name: OCR overlay bbox regression
        run: python scripts/test_ocr_overlay_regions.py
      - name: Bilibili brand side regression
        run: python scripts/test_bilibili_brand.py
      - run: >-
          python -m py_compile
          scripts/localize.py
          scripts/localize_fast.py
          scripts/localize_worker.py
          scripts/analyze_layout.py
          scripts/smart_render.py
          scripts/localize_smart.py
          scripts/localize_worker_smart.py
          scripts/localize_subtitles.py
          scripts/localize_ocr_music.py
          scripts/localize_ocr_music_branded.py
          scripts/localize_ocr_subtitles.py
          scripts/ocr_segment_regions.py
          scripts/bilibili_brand.py
          scripts/brand_badge.py
          scripts/test_ocr_decode_proxy.py
          scripts/test_ocr_overlay_regions.py
          scripts/test_bilibili_brand.py
          scripts/rerender_ocr_music.py
          scripts/render_subtitles.py
          scripts/render_ocr_overlay.py
          scripts/douyin_search_browser.py
          scripts/douyin_search_browser_v2.py
          scripts/douyin_video_browser.py
      - name: Validate inline web JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('web/index.html').read_text(encoding='utf-8')
          start = html.index('<script>') + len('<script>')
          end = html.rindex('</script>')
          Path('/tmp/videoget-web.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/videoget-web.js
      - name: Validate Dockerfile
        run: docker buildx build --check .
